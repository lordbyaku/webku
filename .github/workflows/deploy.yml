name: Deploy

# Dijalankan manual dari tab Actions → Deploy → Run workflow.
# Butuh secrets repo: CLOUDFLARE_API_TOKEN (izin: Workers Scripts/Routes Edit, D1 Edit, R2 Edit)
# dan CLOUDFLARE_ACCOUNT_ID. Sumber daya & database_id harus sudah disiapkan dengan
# scripts/setup-cloudflare.mjs dan di-commit.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Lingkungan"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENV_FLAG: ${{ inputs.target == 'staging' && '--env staging' || '' }}
      DB_NAME: ${{ inputs.target == 'staging' && 'umkm-db-staging' || 'umkm-db' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Tolak deploy produksi bila domain belum diisi
        if: inputs.target == 'production'
        run: |
          if sed -n '1,/"env": {/p' apps/cms-worker/wrangler.jsonc | grep -q "domainku.id"; then
            echo "Domain produksi belum dikonfigurasi (scripts/configure-domain.mjs)"; exit 1
          fi
      - name: Migrasi database
        working-directory: apps/cms-worker
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote $ENV_FLAG
      - name: Deploy Worker situs
        working-directory: apps/site-worker
        run: npx wrangler deploy $ENV_FLAG
      - name: Deploy Worker CMS
        working-directory: apps/cms-worker
        run: npx wrangler deploy $ENV_FLAG
